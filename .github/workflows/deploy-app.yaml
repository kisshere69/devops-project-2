name: (test) Deploy Flask Application.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: flask-app
  EKS_CLUSTER_NAME: devops-project-2
  KUBERNETES_NAMESPACE: flask-app

jobs:
    build-and-push:
        name: Build and Push Docker Image to ECR
        runs-on: ubuntu-latest
        timeout-minutes: 15 # A timeout of 15 minutes to prevent long-running deployments

        # Running the deployment job only on the main branch
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: arn:aws:iam::215229808174:role/devops-project-2-dev-github-actions-role
                role-session-name: github-actions-deploy-app
                aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Generate Docker Image tag
              id: image
              shell: bash
              run: |
                IMAGE_TAG="${GITHUB_SHA::7}"

                echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
                echo "Image tag: $IMAGE_TAG"

            - name: Build Docker Image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
              run: |
                docker build \
                  --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                  ./app

            - name: Push Docker image to Amazon ECR
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
              run: |
                docker push \
                  "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            - name: Configure EKS kubeconfig
              run: |
                aws eks update-kubeconfig \
                  --region "$AWS_REGION" \
                  --name "$EKS_CLUSTER_NAME"

            - name: Verify EKS connection
              run: |
                for permission in \
                  "get deployments.apps" \
                  "get services" \
                  "get configmaps"
                do
                  verb="${permission%% *}"
                  resource="${permission#* }"

                  result="$(
                    kubectl auth can-i "$verb" "$resource" \
                      --namespace "$KUBERNETES_NAMESPACE"
                  )"

                  echo "$verb $resource: $result"

                  if [ "$result" != "yes" ]; then
                    echo "Missing Kubernetes permission: $verb $resource"
                    exit 1
                  fi
                done

            - name: Deploy application with Helm
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
              run: |
                helm upgrade --install flask-app ./helm \
                  --namespace "$KUBERNETES_NAMESPACE" \
                  --values ./helm/values-dev.yaml \
                  --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
                  --set image.tag="$IMAGE_TAG" \
                  --wait \
                  --timeout 5m

            - name: Verify Kubernetes rollout
              run: |
                kubectl rollout status deployment/flask-app \
                  --namespace "$KUBERNETES_NAMESPACE" \
                  --timeout=5m

            - name: Verify Kubernetes resources
              run: |
                kubectl get deployment flask-app \
                  --namespace "$KUBERNETES_NAMESPACE"

                kubectl get pods \
                  --namespace "$KUBERNETES_NAMESPACE" \
                  --selector app.kubernetes.io/name=flask-app \
                  --output=wide

                kubectl get service flask-app \
                  --namespace "$KUBERNETES_NAMESPACE"

            - name: Application smoke test
              run: |
                helm test flask-app \
                  --namespace "$KUBERNETES_NAMESPACE" \
                  --logs \
                  --timeout 2m

            - name: Docker Image Push summary
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
              run: |
                echo "Image successfully pushed:"
                echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
                echo "Application deployment completed successfully."