name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Fix Terraform permissions for act
        if: ${{ env.ACT }}
        run: |
          chmod +x "${TERRAFORM_CLI_PATH}/terraform"
          chmod +x "${TERRAFORM_CLI_PATH}/terraform-bin" || true

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

  helm-checks:
    name: Helm Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./helm

      - name: Helm template validation
        run: |
          helm template flask-app ./helm \
            --namespace flask-app \
            --values helm/values-dev.yaml

  docker-checks:
    name: Docker Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build validation
        run: docker build -t flask-app:ci ./app
  
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform/environments/dev
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan \
          -input=false \
          -lock-timeout=60s \
          -no-color \
          -var-file=terraform.ci.tfvars