name: Deploy Kubernetes Secret

on:
  workflow_dispatch: # Trigger the workflow manually. It'll be changed once the infra is ready.

permissions:
  id-token: write # Request an OIDC token for authentication with AWS
  contents: read

env:
  AWS_REGION: eu-central-1
  EKS_CLUSTER_NAME: devops-project-2
  KUBERNETES_NAMESPACE: flask-app
  KUBERNETES_SECRET_NAME: flask-app-secret

jobs:
  deploy-secret:
    name: Create Kubernetes Secret
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::215229808174:role/devops-project-2-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Kubernetes access
        run: |
          test "$(
            kubectl auth can-i create secrets \
            --namespace "$KUBERNETES_NAMESPACE"
          )" = "yes"

          test "$(
            kubectl auth can-i patch secrets \
            --namespace "$KUBERNETES_NAMESPACE"
          )" = "yes"

      - name: Create or update Kubernetes Secret
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          if [ -z "$APP_SECRET" ]; then
            echo "APP_SECRET is not configured"
            exit 1
          fi

          kubectl create secret generic "$KUBERNETES_SECRET_NAME" \
            --namespace "$KUBERNETES_NAMESPACE" \
            --from-literal=APP_SECRET="$APP_SECRET" \
            --dry-run=client \
            --output=yaml |
          kubectl apply -f -

      - name: Verify Kubernetes Secret
        run: |
          kubectl get secret "$KUBERNETES_SECRET_NAME" \
            --namespace "$KUBERNETES_NAMESPACE" \
            --output=jsonpath='{.metadata.name}{"\n"}'

          kubectl get secret "$KUBERNETES_SECRET_NAME" \
            --namespace "$KUBERNETES_NAMESPACE" \
            --output=jsonpath='{.data.APP_SECRET}' |
          grep -q .