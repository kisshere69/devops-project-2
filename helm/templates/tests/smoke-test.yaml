apiVersion: v1
kind: Pod

metadata:
  name: "{{ include "flask-app.fullname" . }}-smoke-test-{{ .Release.Revision }}"
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test

spec:
  restartPolicy: Never

  containers:
    - name: smoke-test
      image: curlimages/curl:8.16.0
      command:
        - sh
        - -c
      args:
        - |
          set -e

          echo "Testing application root endpoint..."
          curl --fail --silent --show-error \
            http://{{ include "flask-app.fullname" . }}/

          echo
          echo "Testing application health endpoint..."
          curl --fail --silent --show-error \
            http://{{ include "flask-app.fullname" . }}/health

          echo
          echo "Smoke test completed successfully."