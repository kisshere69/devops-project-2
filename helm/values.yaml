replicaCount: 2

image:
  repository: 215229808174.dkr.ecr.eu-central-1.amazonaws.com/flask-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

container:
  port: 5000

config:
  applicationName: devops-project-2

secret:
  existingSecret: flask-app-secret
  key: APP_SECRET

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5

resources:
  requests:
    cpu: 100m # 0.1 vCPU
    memory: 128Mi
  limits:
    cpu: 250m # 0.25 vCPU
    memory: 256Mi